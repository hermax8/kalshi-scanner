# Configuration du scanner Kalshi <-> bookmakers
# Phase 1 : AUCUNE mise. Le scanner lit, compare, enregistre et alerte.

oddspapi:
  # Budget mensuel de requêtes OddsPapi qu'on s'autorise (le scanner s'arrête avant).
  # À ajuster une fois le vrai quota connu (data/discovery/account.json).
  monthly_request_budget: 235   # plan gratuit : 250/mois
  # Slugs OddsPapi des bookmakers (vérifiés dans data/discovery/bookmakers.json).
  bookmakers:
    # Quota gratuit = 1 bookmaker par requête : le scanner tourne d'un bookmaker à l'autre.
    # Pour en (dés)activer un, ajouter/retirer le # devant sa ligne.
    bet365: "bet365"          # compte Malte
    # unibet: "unibet.fr"     # compte FR
    # winamax: "winamax.fr"   # compte FR
    # pokerstars: "pokerstars.fr"  # compte FR
  # Bookmakers utilisés seulement pour les ARBITRAGES (pas d'alertes value), ex. [unibet, winamax]
  arb_only: []

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  # Frais Kalshi (taker) ≈ fee_rate × prix × (1 − prix) par contrat
  fee_rate: 0.07
  # Filtre de liquidité : on ignore les marchés trop minces
  max_spread: 0.05        # écart max achat/vente (5 ¢)
  min_ask_size: 50        # nb mini de contrats disponibles au prix d'achat

thresholds:
  min_arb_margin: 0.005   # arbitrage : profit garanti mini (0,5 %)
  min_value_ev: 0.03      # value : espérance mini (3 %)
  max_value_odds: 8.0     # pas de value sur les cotes > 8 (trop sensibles au moindre centime)
  fx_cost: 0.01           # coût estimé du change USD/EUR quand on mélange Kalshi et un bookmaker
  realert_hours: 12       # pas de nouvelle alerte pour la même opportunité avant X h (sauf si elle s'améliore)

# Une entrée par sport. tournament_ids = IDs OddsPapi (à remplir après la découverte).
# kalshi_series = séries Kalshi des matchs (vérifiées avec data/discovery/kalshi_series.json).
sports:
  soccer:
    outcomes: [home, draw, away]
    oddspapi_market: "101"                       # Résultat du match (1N2), temps réglementaire
    oddspapi_outcomes: {"101": home, "102": draw, "103": away}
    # 17 Premier League, 7 Ligue des champions, 8 LaLiga, 23 Serie A, 35 Bundesliga, 34 Ligue 1
    tournament_ids: [17, 7, 8, 23, 35, 34]   # (5 max par requête : le scanner les répartit en 2 groupes)
    kalshi_series: [KXEPLGAME, KXUCLGAME, KXLALIGAGAME, KXSERIEAGAME, KXBUNDESLIGAGAME, KXLIGUE1GAME]
  tennis:
    outcomes: [p1, p2]
    oddspapi_market: "121"                       # Vainqueur du match
    oddspapi_outcomes: {"121": p1, "122": p2}
    # Aucun match Kalshi ouvert pour l'instant (fin de saison). À remplir à la reprise (janvier).
    tournament_ids: []
    kalshi_series: [KXATPMATCH, KXWTAMATCH]
  basketball:
    outcomes: [p1, p2]
    oddspapi_market: "111"                       # Vainqueur prolongations incluses
    oddspapi_outcomes: {"111": p1, "112": p2}
    # 132 NBA, 138 EuroLeague
    tournament_ids: [132, 138]
    kalshi_series: [KXNBAGAME, KXEUROLEAGUEGAME]

# Série Kalshi -> compétition OddsPapi (pour ne comparer que ce qui a été récupéré)
series_tournament:
  KXEPLGAME: 17
  KXUCLGAME: 7
  KXLALIGAGAME: 8
  KXSERIEAGAME: 23
  KXBUNDESLIGAGAME: 35
  KXLIGUE1GAME: 34
  KXNBAGAME: 132
  KXEUROLEAGUEGAME: 138

# Noms différents entre Kalshi et les bookmakers : "nom Kalshi": "nom bookmaker"
aliases:
  "man city": "manchester city"
  "man united": "manchester united"
  "spurs": "tottenham hotspur"
  "wolves": "wolverhampton wanderers"
  "psg": "paris saint germain"
  "inter": "inter milan"
  "atletico": "atletico madrid"
  "m gladbach": "borussia monchengladbach"
  "gladbach": "borussia monchengladbach"
  "leverkusen": "bayer leverkusen"
  "bilbao": "athletic bilbao"
  "athletic club": "athletic bilbao"
  "nottm forest": "nottingham forest"
  "sheff utd": "sheffield united"
