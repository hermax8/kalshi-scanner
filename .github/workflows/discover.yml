name: discover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Découverte Kalshi + OddsPapi
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: python discover.py
      - name: Sauvegarde
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "discover: catalogue Kalshi + OddsPapi"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
