name: telegram-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "longueur token: ${#TOKEN} / longueur chat id: ${#CHAT}"
          echo "--- getMe (IPv4)"
          curl -4 -sS -m 20 -w "\nHTTP %{http_code} en %{time_total}s\n" "https://api.telegram.org/bot${TOKEN}/getMe" | sed 's/"id":[0-9]*/"id":X/'
          echo "--- sendMessage (IPv4)"
          curl -4 -sS -m 20 -w "\nHTTP %{http_code} en %{time_total}s\n" -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT}" -d text="✅ Test du scanner Kalshi : ce bot peut t'écrire." | head -c 400
          echo
          echo "--- sendMessage (IPv6/auto)"
          curl -sS -m 20 -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" "https://api.telegram.org/bot${TOKEN}/getMe" || true
